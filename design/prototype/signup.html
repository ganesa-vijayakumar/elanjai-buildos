<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up — ElanjaiBuildos</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="center"><div style="width:100%;max-width:560px">
  <div class="brand" style="margin-bottom:20px"><span class="mark">E</span>ElanjaiBuildos</div>
  <h1 style="font-size:1.75rem">Create your workspace</h1>
  <p class="small" style="margin:6px 0 24px">Free 14-day trial · no card required · reviewed within 24h</p>

  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-bottom:14px">Company</h3>
    <div class="field"><label class="label" for="co">Company name</label>
      <input class="input" id="co" placeholder="Acme Builders Pvt Ltd" data-testid="company-name"></div>
    <div class="field"><label class="label" for="slug">Subdomain</label>
      <div style="display:flex;align-items:center;gap:10px">
        <input class="input" id="slug" placeholder="acme" data-testid="slug-input" style="max-width:180px">
        <span class="muted small">.elanjai.app</span>
        <span class="badge b-active" data-testid="slug-ok">available</span>
      </div>
      <div class="hint">This is your workspace URL — can't be changed later.</div></div>
    <div class="field"><label class="label" for="gst">GSTIN <span class="muted">(optional)</span></label>
      <input class="input" id="gst" placeholder="33AAAAA0000A1Z5"></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-bottom:14px">Owner account</h3>
    <div class="grid grid-2">
      <div class="field"><label class="label" for="nm">Your name</label><input class="input" id="nm"></div>
      <div class="field"><label class="label" for="ph">Phone</label><input class="input" id="ph" type="tel" placeholder="+91"></div>
    </div>
    <div class="field"><label class="label" for="em">Email</label><input class="input" id="em" type="email" data-testid="signup-email"></div>
    <div class="field"><label class="label" for="pw">Password</label><input class="input" id="pw" type="password">
      <div class="meter" style="margin-top:8px"><i style="width:45%"></i></div>
      <div class="hint">Minimum 8 characters</div></div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <h3 style="margin-bottom:14px">Choose a plan</h3>
    <div class="grid grid-2" data-testid="plan-picker">
      <label class="card opt-card"><input type="radio" name="plan"> <b>Starter</b><div class="small">₹1,499/mo · 5 projects · 2 staff</div></label>
      <label class="card opt-card"><input type="radio" name="plan" checked> <b>Professional</b><div class="small">₹2,999/mo · 20 projects · 5 staff</div></label>
      <label class="card opt-card"><input type="radio" name="plan"> <b>Business</b><div class="small">₹4,999/mo · 50 projects · 15 staff</div></label>
      <label class="card opt-card"><input type="radio" name="plan"> <b>Enterprise</b><div class="small">₹9,999+/mo · unlimited</div></label>
    </div>
  </div>

  <button class="btn btn-primary btn-lg" style="width:100%" data-testid="signup-submit"
    onclick="location.href='pending.html'">Create workspace</button>
  <p class="small" style="margin-top:18px;text-align:center">Already have a workspace? <a href="login.html">Sign in</a></p>
</div></div>
</body>
</html>
