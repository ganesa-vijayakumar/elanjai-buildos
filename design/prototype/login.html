<!doctype html>
<html lang="en" style="--tenant-primary:#0e7490;--tenant-primary-hover:#155e75">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Acme Builders</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="auth-split">
  <aside class="auth-aside" style="--action:var(--tenant-primary)">
    <div class="brand" style="color:#fff"><span class="mark">A</span>Acme Builders</div>
    <p class="quote">"Stage-wise collections and client updates in one place — our customers finally stopped calling for photos every day."</p>
  </aside>
  <main class="center"><div class="auth-card">
    <h2>Sign in to your workspace</h2>
    <p class="muted small" style="margin:4px 0 24px">acme.elanjai.app</p>
    <div class="field"><label class="label" for="em">Email</label>
      <input class="input" id="em" type="email" autocomplete="username" placeholder="you@acmebuilders.com"></div>
    <div class="field"><label class="label" for="pw">Password</label>
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-primary" style="width:100%" data-testid="login-submit"
      onclick="location.href='tenant/dashboard.html'">Sign in</button>
    <p class="small" style="margin-top:18px;text-align:center"><a href="#">Forgot password?</a></p>
  </div></main>
</div>
</body>
</html>
