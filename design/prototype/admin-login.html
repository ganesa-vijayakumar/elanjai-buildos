<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform admin — ElanjaiBuildos</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="auth-split">
  <aside class="auth-aside">
    <div class="brand" style="color:#fff"><span class="mark">E</span>Elanjai Platform</div>
    <p class="quote">Tenant approvals, subscriptions, usage metering and lifecycle — the control room for the whole platform.</p>
  </aside>
  <main class="center"><div class="auth-card">
    <h2>Admin sign in</h2>
    <p class="muted small" style="margin:4px 0 24px">admin.elanjai.app</p>
    <div class="field"><label class="label" for="em">Email</label>
      <input class="input" id="em" type="email" autocomplete="username" placeholder="admin@elanjaitech.com"></div>
    <div class="field"><label class="label" for="pw">Password</label>
      <input class="input" id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%;--action:var(--slate-900);--action-hover:var(--slate-800)"
      onclick="location.href='admin/dashboard.html'">Sign in</button>
  </div></main>
</div>
</body>
</html>
