spring.application.name=elanjai-buildos-backend-test

# Test database — a dedicated sandbox database, never the dev database.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/elanjai_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET search_path TO public

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

app.jwt.secret=test-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef
app.jwt.expiration-ms=3600000

app.demo.seed=false
app.tenancy.base-domain=localhost
app.tenancy.schema-prefix=t_
app.tenancy.admin-host=admin.localhost
app.tenancy.dev-header-enabled=false
app.tenancy.reserved-slugs=www,app,api,admin,mail,smtp,ftp,localhost,support,help,blog,docs,status,billing,dashboard,platform,root,system,elanjai,elanjaibuildos,demo-new
app.tenancy.trial-days=14
app.tenancy.grace-days=7
app.tenancy.retention-days=30

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
app.base-url=http://localhost:5173
app.tenant-url-template=http://{slug}.localhost:5173

platform.admin.email=admin@elanjai.local
platform.admin.password=Admin@123
platform.support.email=support@elanjai.local
platform.support.password=Support@123

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=no-reply@elanjai.local
app.mail.enabled=false
app.mail.poll-ms=3600000

app.storage.root=./target/test-files
app.razorpay.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/api/actuator
management.endpoint.health.show-details=never
# no SMTP listener in the test sandbox — mail health is noise here (it stays
# monitored in deployment, where Mailpit/SMTP is part of the topology)
management.health.mail.enabled=false
server.port=0
