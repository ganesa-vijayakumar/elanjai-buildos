spring.application.name=elanjai-buildos

# ============================================================
# DataSource — PostgreSQL (platform datasource; tenant schemas via search_path)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/elanjai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-init-sql=SET search_path TO public

# ============================================================
# JPA / Hibernate — Flyway is authoritative for ALL DDL (D-067)
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# Flyway — public schema migrations run at startup;
# tenant migrations (db/migration-tenant) run per-schema by
# TenantSchemaProvisioningService on approval + startup catch-up.
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# ============================================================
# Security (JWT) — secret via env; two realms: platform / tenant
# ============================================================
app.jwt.secret=${JWT_SECRET:9a2f8c4e6b0d71f3e8b925a45747f894a3d6bc70fa8d51211234567890abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Tenancy
# ============================================================
app.tenancy.base-domain=${TENANT_BASE_DOMAIN:localhost}
app.tenancy.schema-prefix=t_
app.tenancy.admin-host=${TENANT_ADMIN_HOST:admin.localhost}
app.tenancy.dev-header-enabled=${TENANT_DEV_HEADER:true}
app.tenancy.dev-query-param=tenant
app.tenancy.reserved-slugs=www,app,api,admin,mail,smtp,ftp,localhost,support,help,blog,docs,status,billing,dashboard,platform,root,system,elanjai,elanjaibuildos,demo-new
app.tenancy.trial-days=14
app.tenancy.grace-days=7
app.tenancy.retention-days=30

# ============================================================
# Razorpay — test keys via env (never committed)
# ============================================================
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.enabled=${RAZORPAY_ENABLED:false}

# ============================================================
# Mail — Mailpit in dev Compose
# ============================================================
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:no-reply@elanjai.app}
app.mail.enabled=${MAIL_ENABLED:true}

# ============================================================
# File storage — local volume (S3 adapter seam later, D-048)
# ============================================================
app.storage.root=${STORAGE_ROOT:./data/files}
app.storage.max-upload-mb=10

# ============================================================
# Platform billing (GST)
# ============================================================
app.billing.platform-gstin=${PLATFORM_GSTIN:33AABCE0000A1Z5}
app.billing.platform-name=Elanjai Technologies
app.billing.platform-state=${PLATFORM_STATE:Tamil Nadu}
app.billing.sac-code=998314

# ============================================================
# Server / CORS / misc
# ============================================================
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://*.localhost:5173}
app.demo.seed=${DEMO_SEED:true}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
