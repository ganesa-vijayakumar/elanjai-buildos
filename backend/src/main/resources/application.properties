spring.application.name=backend

# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/elanjai_dev?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Security (JWT) - Change this secret in production!
app.jwt.secret=9a2f8c4e6b0d71f3e8b925a45747f894a3d6bc70fa8d51211234567890abcdef
app.jwt.expiration-ms=86400000

# Server
server.port=8080
