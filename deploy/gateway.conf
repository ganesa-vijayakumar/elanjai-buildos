# Edge router: maps Host → the right independent frontend service.
#   apex / www / anything else      → landing
#   admin.<base-domain>             → admin
#   <slug>.<base-domain>            → tenant (shared app, all workspaces)
#
# Trust boundary: the canonical Host is preserved end-to-end (the backend's
# TenantResolutionFilter reads raw Host, NOT X-Forwarded-Host), and every
# client-supplied forwarded/tenant header is REWRITTEN or DROPPED here — an
# empty proxy_set_header value removes the header. The backend must not be
# directly reachable outside this edge in production.

resolver 127.0.0.11 valid=10s ipv6=off;

map $host $app_upstream {
    default                       http://landing:80;
    ~^admin\.                     http://admin:80;
    ~^www\.                       http://landing:80;
    ~^[a-z0-9][a-z0-9-]*\.        http://tenant:80;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sanitize at the edge: fresh values only, never the client's.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-ID "";   # dev-only backend override — dropped here
    }
}
