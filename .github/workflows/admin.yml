name: frontend-admin

on:
    push:
        branches: [main, develop]
        paths:
            - 'apps/admin/**'
            - 'packages/shared/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.base.json'
            - '.github/workflows/admin.yml'
    pull_request:
        paths:
            - 'apps/admin/**'
            - 'packages/shared/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.base.json'
            - '.github/workflows/admin.yml'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - name: Typecheck + bundle
              run: npm run build -w @buildos/admin
            - name: Docker image (build-only)
              run: docker build -f apps/admin/Dockerfile -t buildos-admin:ci .
