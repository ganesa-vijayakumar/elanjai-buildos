name: frontend-landing

# Landing-only changes produce only the landing artifact — the tenant and
# admin pipelines do not run for paths outside their scope.
# Manual-only build check — dispatch on demand; nothing runs automatically.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - name: Typecheck + bundle
              run: npm run build -w @buildos/landing
            - name: Docker image (build-only)
              run: docker build -f apps/landing/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t buildos-landing:${{ github.sha }} -t buildos-landing:ci .
