name: backend

on:
    push:
        branches: [main, develop]
        paths: ['backend/**', '.github/workflows/backend.yml']
    pull_request:
        paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
    verify:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: elanjai_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres -d elanjai_test"
                    --health-interval 5s --health-timeout 3s --health-retries 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'
            - uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: m2-${{ hashFiles('backend/pom.xml') }}
            - name: Unit + integration tests (tenant isolation, realm boundary, provisioning)
              working-directory: backend
              env:
                  TEST_DB_URL: jdbc:postgresql://localhost:5432/elanjai_test
              run: mvn -B verify
            - name: Docker image (build-only)
              run: docker build -t buildos-backend:ci backend/
