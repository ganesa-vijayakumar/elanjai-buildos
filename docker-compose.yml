name: elanjai-buildos

services:
  postgres:
    image: postgres:16-alpine
    container_name: elanjai-postgres
    environment:
      POSTGRES_DB: elanjai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 — avoids clash with local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elanjai"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: elanjai-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BUILDOS_BACKEND_IMAGE:-buildos-backend:dev}
    container_name: elanjai-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elanjai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef0123456789abcdef}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@elanjai.local
      TENANT_BASE_DOMAIN: localhost
      TENANT_ADMIN_HOST: admin.localhost
      TENANT_DEV_HEADER: "true"          # dev compose only — production leaves this unset/false
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      TENANT_URL_TEMPLATE: ${TENANT_URL_TEMPLATE:-http://{slug}.localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://*.localhost:5173,http://*.localhost:5174,http://*.localhost:5175}
      RAZORPAY_ENABLED: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STORAGE_ROOT: /data/files
      DEMO_SEED: "true"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - app-files:/data/files

  # ----- independently deployable frontend apps -----
  # Each builds only its own sources; a landing-only change rebuilds `landing`
  # and nothing else. Image refs are env-overridable: in a registry-backed
  # deployment set BUILDOS_*_IMAGE to a pushed tag/digest (promote + rollback by
  # repointing, per Prody enhancements/03-deployment/02); dev uses local *:dev.

  landing:
    image: ${BUILDOS_LANDING_IMAGE:-buildos-landing:dev}
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-localhost}
        VITE_ADMIN_HOST: ${TENANT_ADMIN_HOST:-admin.localhost}
    container_name: elanjai-landing
    ports:
      - "5173:80"      # direct access for debugging
    depends_on:
      - backend

  tenant:
    image: ${BUILDOS_TENANT_IMAGE:-buildos-tenant:dev}
    build:
      context: .
      dockerfile: apps/tenant/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-localhost}
        VITE_ADMIN_HOST: ${TENANT_ADMIN_HOST:-admin.localhost}
    container_name: elanjai-tenant
    ports:
      - "5175:80"
    depends_on:
      - backend

  admin:
    image: ${BUILDOS_ADMIN_IMAGE:-buildos-admin:dev}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-localhost}
        VITE_ADMIN_HOST: ${TENANT_ADMIN_HOST:-admin.localhost}
    container_name: elanjai-admin
    ports:
      - "5174:80"
    depends_on:
      - backend

  # Edge router — apex/www → landing, admin.* → admin, <slug>.* → tenant.
  # *.localhost resolves to 127.0.0.1, so http://acme.localhost works locally.
  gateway:
    image: nginx:alpine
    container_name: elanjai-gateway
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - landing
      - tenant
      - admin
      - backend

volumes:
  pgdata:
  app-files:
