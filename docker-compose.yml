name: elanjai-buildos

services:
  postgres:
    image: postgres:16-alpine
    container_name: elanjai-postgres
    environment:
      POSTGRES_DB: elanjai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 — avoids clash with local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elanjai"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: elanjai-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elanjai-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elanjai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef0123456789abcdef}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@elanjai.local
      TENANT_BASE_DOMAIN: localhost
      TENANT_ADMIN_HOST: admin.localhost
      TENANT_DEV_HEADER: "true"
      RAZORPAY_ENABLED: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STORAGE_ROOT: /data/files
      DEMO_SEED: "true"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - app-files:/data/files

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: elanjai-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"

volumes:
  pgdata:
  app-files:
